<header class="flex align-items-center justify-content-between gap-1 sm:gap-3 px-2  sm:pr-3">
  <div class="flex align-items-center gap-1">
    <p-button icon="pi pi-bars" text [rounded]="true" pTooltip="Toggle sidebar"
      [attr.aria-expanded]="!layoutUi.sidebarCollapsed()" (click)="layoutUi.toggleSidebar()">
    </p-button>
  </div>

  <div class="flex align-items-center gap-1 sm:gap-2 ml-auto">
    <p-select class="k-branch-select" [options]="branches()" optionLabel="name" size="small" optionValue="id"
      [ngModel]="selectedBranchId()" (onChange)="onBranchChange($event.value)" />

    <p-button text  [rounded]="true" icon="pi pi-bell">
    </p-button>

    <div class="cursor-pointer" (click)="userPopover.toggle($event)">
      <p-avatar [label]="userInitials" shape="circle"  styleClass="bg-primary" />
    </div>
    <p-popover #userPopover>
      <div class="flex flex-column gap-3" style="min-width: 220px;">
        <div class="flex align-items-center gap-2">
          <p-avatar [label]="userInitials" shape="circle" styleClass="bg-primary" />
          <div>
            <div class="font-medium">{{ userName }}</div>
            <div class="text-sm text-color-secondary">{{ userEmail }}</div>
          </div>
        </div>
        <p-divider styleClass="my-0" />
        <button pButton [text]="true" class="justify-content-start w-full" (click)="logout(); userPopover.hide()">
          <i class="pi pi-sign-out mr-2"></i> Logout
        </button>
      </div>
    </p-popover>
  </div>
</header>
