<header class="flex align-items-center justify-content-between gap-1 sm:gap-3 px-1  sm:pr-3">
  <div class="flex align-items-center gap-1">
    <p-button [icon]="layoutUi.sidebarCollapsed() ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'" text
      [rounded]="true" pTooltip="Toggle sidebar" [attr.aria-expanded]="!layoutUi.sidebarCollapsed()"
      (click)="layoutUi.toggleSidebar()">
    </p-button>
  </div>

  <div class="flex align-items-center gap-1 sm:gap-2 ml-auto">
    <p-select #branchSelect styleClass="k-branch-select" [options]="branches()" optionLabel="name"
      optionValue="id" dropdownIcon="pi pi-chevron-down" [ngModel]="selectedBranchId()"
      (onChange)="onBranchChange($event.value)"
      [overlayOptions]="{ styleClass: 'k-branch-panel' }" scrollHeight="20rem" ariaLabel="Switch branch">
      <!-- The trigger reads the branch from the service rather than the template
           context, so it stays right whatever optionValue is set to. -->
      <ng-template #selectedItem>
        <span class="k-branch-trigger">
          <i class="pi pi-building"></i>
          <span class="k-branch-name">{{ branchContext.selectedBranch().name }}</span>
        </span>
      </ng-template>

      <ng-template #item let-branch>
        <span class="k-branch-option">
          <span class="k-branch-name">{{ branch.name }}</span>
        </span>
      </ng-template>

      <ng-template #footer>
        <a class="k-branch-foot" routerLink="/settings/branches" (click)="branchSelect.hide()">
          <i class="pi pi-cog"></i>
          <span>Manage branches</span>
        </a>
      </ng-template>
    </p-select>

    <p-button text [rounded]="true" icon="pi pi-bell" pTooltip="Notifications" tooltipPosition="bottom"
      ariaLabel="Notifications">
    </p-button>

    <button type="button" class="k-avatar-button" [attr.aria-label]="'Account menu for ' + userName"
      (click)="userPopover.toggle($event)">
      <p-avatar [label]="userInitials" shape="circle" styleClass="k-topbar-avatar" />
    </button>
    <p-popover #userPopover>
      <div class="k-user-popover flex flex-column gap-3">
        <div class="flex align-items-center gap-2">
          <p-avatar [label]="userInitials" shape="circle" styleClass="k-topbar-avatar" />
          <div>
            <div class="font-medium">{{ userName }}</div>
            <div class="text-sm text-color-secondary">{{ userEmail }}</div>
          </div>
        </div>
        <p-divider styleClass="my-0" />
        <button pButton [text]="true" class="justify-content-start w-full" (click)="logout(); userPopover.hide()">
          <i class="pi pi-sign-out mr-2"></i> Logout
        </button>
      </div>
    </p-popover>
  </div>
</header>
