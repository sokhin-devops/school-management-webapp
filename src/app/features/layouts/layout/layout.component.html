<div class="k-layout">
  <app-k-sidebar />
  <div class="k-layout-main">
    <app-k-topbar />
    <div class="k-layout-content">
      <div
        class="k-breadcrumb px-3 py-2 flex justify-content-between align-items-center border-bottom-1 surface-border">
        <p-breadcrumb [home]="breadcrumb.home()" [model]="breadcrumb.items()" />
        <div class="flex gap-2">
          @if (showLayoutToggle()) {
          <p-selectbutton [ngModel]="layoutUi.layout()" (ngModelChange)="layoutUi.setLayout($event)"
            [options]="layoutUi.options" [allowEmpty]="false" size="small">
            <ng-template #item let-item>
              <i class="pi" [ngClass]="{ 'pi-bars': item === 'list', 'pi-table': item === 'grid' }"></i>
            </ng-template>
          </p-selectbutton>
          } @else {
          <p-button icon="pi pi-plus-circle" rounded="true" size="small" pTooltip="Quick Add"></p-button>
          }
        </div>


      </div>
      <main class="k-layout-body">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
