<aside class="k-sidebar" [class.k-sidebar-open]="layoutUi.mobileDrawerOpen()"
  [class.k-sidebar-collapsed]="layoutUi.sidebarCollapsed()">
  <div class="k-sidebar-brand">
    <span class="k-brand-mark" aria-hidden="true">
      <i class="pi pi-building"></i>
    </span>
    <span class="k-brand-text">
      <span class="k-brand-name">Norton University</span>
      <span class="k-brand-meta">School management</span>
    </span>
  </div>

  <!-- The brand stays put; only the nav scrolls, with an overlay bar so a long
       menu never steals width from the rows. -->
  <p-scrollpanel styleClass="k-sidebar-scroll">
    <div #navContent class="k-sidebar-nav">
      @if (layoutUi.sidebarCollapsed()) {
      <!-- Icons only (05-sidebar-navigation.md). Labels move to tooltips, children to popovers. -->
      <nav class="k-sidebar-rail">
        @for (item of navItems; track item.label) {
        <div class="k-rail-slot">
          <button type="button" class="k-rail-item" [class.k-rail-item-active]="isItemActive(item)"
            [pTooltip]="item.label" tooltipPosition="right" [attr.aria-label]="item.label"
            (click)="onRailClick(item, $event, childPopover)">
            <i [class]="item.icon"></i>
          </button>

          <!-- Declared for every item, opened only for the ones with children, so
               the button (outside any @if) can still reference it. -->
          <p-popover #childPopover styleClass="k-rail-popover">
            <p-menu [model]="item.items ?? []" />
          </p-popover>
        </div>
        }
      </nav>
      } @else {
      <p-panelmenu [model]="navItems" [multiple]="true" styleClass="k-sidebar-menu" />
      }
    </div>
  </p-scrollpanel>
</aside>

@if (layoutUi.mobileDrawerOpen()) {
<div class="k-sidebar-backdrop" (click)="layoutUi.closeMobileDrawer()"></div>
}
