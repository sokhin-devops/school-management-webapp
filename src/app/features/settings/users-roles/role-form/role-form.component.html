<k-form-dialog [visible]="visible()" (visibleChange)="visible.set($event)"
  [title]="isEdit() ? 'Edit role' : 'Create role'"
  [subtitle]="isEdit() ? 'Update this record and save.' : 'Create a role and choose what it can reach.'"
  [saveLabel]="isEdit() ? 'Save changes' : 'Create role'" width="38rem" (save)="onSave()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="onSave()">
    <k-form-field [label]="labels.name" inputId="role-name" [control]="form.controls.name">
      <input pInputText id="role-name" formControlName="name" autocomplete="off" placeholder="Branch Admin" />
    </k-form-field>

    <k-form-field [label]="labels.permissions" inputId="role-permissions" [control]="form.controls.permissions"
      [hint]="grantedCount() ? grantedCount() + ' of 32 permissions granted.' : 'Tick a module for everything in it, or open it to choose.'">
      <p-tree [value]="nodes" selectionMode="checkbox" [selection]="selection()" (selectionChange)="onSelectionChange($event)"
        styleClass="k-permission-tree" [metaKeySelection]="false" ariaLabel="Permissions" />
    </k-form-field>

    <k-form-field [label]="labels.branchIds" inputId="role-branches" [control]="form.controls.branchIds"
      hint="Leave empty for every branch.">
      <p-multiselect inputId="role-branches" formControlName="branchIds" [options]="branchChoices()" optionLabel="label"
        optionValue="value" placeholder="All branches" display="chip" [filter]="true" filterBy="label" />
    </k-form-field>
  </form>
</k-form-dialog>
