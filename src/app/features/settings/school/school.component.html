<div class="k-page-scroll">
  @if (loadError(); as error) {
    <k-settings-section title="School profile" [description]="error">
      <ng-container k-actions>
        <p-button label="Try again" icon="pi pi-refresh" size="small" severity="secondary" [outlined]="true"
          (onClick)="retry()" />
      </ng-container>
    </k-settings-section>
  } @else {
  @if (!school()) {
    <p-skeleton height="14rem" styleClass="mb-3" />
    <p-skeleton height="12rem" styleClass="mb-3" />
  } @else {
  <k-settings-section title="School profile" description="How the school is named across the app and on its invoices.">
    <div class="grid">
      <div class="col-12 md:col-8">
        <div class="k-field">
          <label class="k-field-label" for="school-name">School name</label>
          <input pInputText pSize="small" id="school-name" [(ngModel)]="name" />
        </div>
      </div>
      <div class="col-12 md:col-4">
        <div class="k-field">
          <label class="k-field-label" for="school-short">Short name</label>
          <input pInputText pSize="small" id="school-short" [(ngModel)]="shortName" />
          <span class="k-field-hint">An abbreviation, such as RIS.</span>
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="k-field">
          <label class="k-field-label" for="school-type">Institution type</label>
          <p-select inputId="school-type" [options]="schoolTypeOptions" [(ngModel)]="schoolType" optionLabel="label"
            optionValue="value" size="small" />
          <span class="k-field-hint">Which academic concepts are used is set under Academic settings.</span>
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="k-field">
          <label class="k-field-label" for="school-site">Website</label>
          <input pInputText pSize="small" id="school-site" type="url" placeholder="https://" [(ngModel)]="website" />
        </div>
      </div>
    </div>

    <ng-container k-actions>
      <p-button *kCan="'edit'" label="Cancel" size="small" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button *kCan="'edit'" label="Save changes" icon="pi pi-check" size="small" [loading]="saving()" (onClick)="save()" />
    </ng-container>
  </k-settings-section>

  <k-settings-section title="Contact details" description="How families and staff reach the school office.">
    <div class="grid">
      <div class="col-12 md:col-6">
        <div class="k-field">
          <label class="k-field-label" for="school-email">Email</label>
          <input pInputText pSize="small" id="school-email" type="email" [(ngModel)]="email" />
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="k-field">
          <label class="k-field-label" for="school-phone">Phone</label>
          <input pInputText pSize="small" id="school-phone" type="tel" [(ngModel)]="phone" />
        </div>
      </div>
      <div class="col-12">
        <div class="k-field">
          <label class="k-field-label" for="school-address">Address</label>
          <textarea pTextarea id="school-address" rows="3" [(ngModel)]="address"></textarea>
        </div>
      </div>
    </div>

    <ng-container k-actions>
      <p-button *kCan="'edit'" label="Save changes" icon="pi pi-check" size="small" [loading]="saving()" (onClick)="save()" />
    </ng-container>
  </k-settings-section>

  <k-settings-section title="Currency" description="How every amount in the system is shown.">
    <div class="grid">
      <div class="col-12 md:col-5">
        <div class="k-field">
          <label class="k-field-label" for="school-currency">Currency</label>
          <p-select inputId="school-currency" [options]="currencyOptions" [(ngModel)]="currency" optionLabel="label"
            optionValue="value" size="small" [filter]="true" filterBy="label" />
          <span class="k-field-hint">Fees, payments, expenses and reports are shown in it. Amounts already entered
            are not converted.</span>
        </div>
      </div>
    </div>

    <ng-container k-actions>
      <p-button *kCan="'edit'" label="Save changes" icon="pi pi-check" size="small" [loading]="saving()" (onClick)="save()" />
    </ng-container>
  </k-settings-section>
  }
  }
</div>
