<k-form-dialog [visible]="visible()" (visibleChange)="visible.set($event)"
  [title]="isEdit() ? 'Edit teacher' : 'Add teacher'"
  [subtitle]="isEdit() ? 'Update this record and save.' : 'Add a teacher to the current branch.'"
  [saveLabel]="isEdit() ? 'Save changes' : 'Add teacher'" width="42rem" (save)="onSave()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="onSave()">
    <div class="k-form-row">
      <k-form-field [label]="labels.firstName" inputId="teacher-first-name" [control]="form.controls.firstName">
        <input pInputText id="teacher-first-name" formControlName="firstName" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.lastName" inputId="teacher-last-name" [control]="form.controls.lastName">
        <input pInputText id="teacher-last-name" formControlName="lastName" autocomplete="off" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.employeeNumber" inputId="teacher-employee" [control]="form.controls.employeeNumber"
        hint="Unique across the school.">
        <input pInputText id="teacher-employee" formControlName="employeeNumber" autocomplete="off"
          placeholder="EMP-2024-001" />
      </k-form-field>

      <k-form-field [label]="labels.department" inputId="teacher-department" [control]="form.controls.department">
        <p-select inputId="teacher-department" formControlName="department" [options]="departmentChoices()"
          optionLabel="label" optionValue="value" placeholder="Choose or type a department" [editable]="true" />
      </k-form-field>
    </div>

    @if (academic.settings().useSubjects) {
      <k-form-field [label]="labels.subjectIds" inputId="teacher-subjects" [control]="form.controls.subjectIds"
        hint="Optional.">
        <p-multiselect inputId="teacher-subjects" formControlName="subjectIds" [options]="subjectChoices()"
          optionLabel="label" optionValue="value" placeholder="None yet" display="chip" [filter]="true" filterBy="label" />
      </k-form-field>
    }

    <div class="k-form-row">
      <k-form-field [label]="labels.email" inputId="teacher-email" [control]="form.controls.email">
        <input pInputText id="teacher-email" type="email" formControlName="email" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.phone" inputId="teacher-phone" [control]="form.controls.phone" hint="Optional.">
        <input pInputText id="teacher-phone" formControlName="phone" autocomplete="off" placeholder="+1 555-020-2000" />
      </k-form-field>
    </div>

    <k-form-field [label]="labels.status" inputId="teacher-status" [control]="form.controls.status">
      <p-select inputId="teacher-status" formControlName="status" [options]="statusOptions" optionLabel="label"
        optionValue="value" />
    </k-form-field>
  </form>
</k-form-dialog>
