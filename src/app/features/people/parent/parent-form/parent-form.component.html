<k-form-dialog [visible]="visible()" (visibleChange)="visible.set($event)"
  [title]="isEdit() ? 'Edit parent' : 'Add parent'"
  [subtitle]="isEdit() ? 'Update this record and save.' : 'Add a parent or guardian and link their children.'"
  [saveLabel]="isEdit() ? 'Save changes' : 'Add parent'" width="42rem" (save)="onSave()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="onSave()">
    <div class="k-form-row">
      <k-form-field [label]="labels.firstName" inputId="parent-first-name" [control]="form.controls.firstName">
        <input pInputText id="parent-first-name" formControlName="firstName" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.lastName" inputId="parent-last-name" [control]="form.controls.lastName">
        <input pInputText id="parent-last-name" formControlName="lastName" autocomplete="off" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.relationship" inputId="parent-relationship" [control]="form.controls.relationship">
        <p-select inputId="parent-relationship" formControlName="relationship" [options]="relationshipOptions"
          optionLabel="label" optionValue="value" placeholder="Select a relationship" />
      </k-form-field>

      <k-form-field [label]="labels.status" inputId="parent-status" [control]="form.controls.status">
        <p-select inputId="parent-status" formControlName="status" [options]="statusOptions" optionLabel="label"
          optionValue="value" />
      </k-form-field>
    </div>

    <k-form-field [label]="labels.studentIds" inputId="parent-children" [control]="form.controls.studentIds"
      hint="Pick from students already on the roster.">
      <p-multiselect inputId="parent-children" formControlName="studentIds" [options]="childOptions()" optionLabel="label"
        optionValue="value" placeholder="None yet" display="chip" [filter]="true" filterBy="label" />
    </k-form-field>

    <div class="k-form-row">
      <k-form-field [label]="labels.email" inputId="parent-email" [control]="form.controls.email">
        <input pInputText id="parent-email" type="email" formControlName="email" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.phone" inputId="parent-phone" [control]="form.controls.phone"
        hint="The number the school calls first.">
        <input pInputText id="parent-phone" formControlName="phone" autocomplete="off" placeholder="+1 555-030-3000" />
      </k-form-field>
    </div>
  </form>
</k-form-dialog>
