<article class="k-student-card">
  <header class="k-student-card-head">
    <p-avatar [label]="initials" shape="circle" styleClass="k-student-card-avatar" />

    <div class="k-student-card-identity">
      <h3 class="k-student-card-name">{{ student.firstName }} {{ student.lastName }}</h3>
      <span class="k-student-card-id">{{ student.studentDetails?.admissionNumber }}</span>
    </div>

    <p-tag [value]="student.status" [severity]="statusSeverity(student.status)" styleClass="k-student-card-status" />
  </header>

  <div class="k-student-card-meta">
    <div class="k-student-card-row">
      <i class="pi pi-graduation-cap"></i>
      <span>{{ student.className }}</span>
    </div>
    @if (student.email) {
    <div class="k-student-card-row">
      <i class="pi pi-envelope"></i>
      <span>{{ student.email }}</span>
    </div>
    }
    @if (student.phone) {
    <div class="k-student-card-row">
      <i class="pi pi-phone"></i>
      <span>{{ student.phone }}</span>
    </div>
    }
  </div>

  <footer class="k-student-card-actions">
    <p-button icon="pi pi-eye" [text]="true" [rounded]="true" size="small" severity="secondary" pTooltip="View" />
    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" severity="secondary" pTooltip="Edit" />
    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" size="small" severity="danger" pTooltip="Delete" />
  </footer>
</article>
