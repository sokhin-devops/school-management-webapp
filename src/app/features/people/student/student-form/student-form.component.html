<k-form-dialog [visible]="visible()" (visibleChange)="visible.set($event)"
  [title]="isEdit() ? 'Edit student' : 'Add student'"
  [subtitle]="isEdit() ? 'Update this record and save.' : 'Enrol a student in the current branch.'"
  [saveLabel]="isEdit() ? 'Save changes' : 'Add student'" width="42rem" (save)="onSave()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="onSave()">
    <div class="k-form-row">
      <k-form-field [label]="labels.firstName" inputId="student-first-name" [control]="form.controls.firstName">
        <input pInputText id="student-first-name" formControlName="firstName" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.lastName" inputId="student-last-name" [control]="form.controls.lastName">
        <input pInputText id="student-last-name" formControlName="lastName" autocomplete="off" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.admissionNumber" inputId="student-admission" [control]="form.controls.admissionNumber"
        hint="Unique across the school.">
        <input pInputText id="student-admission" formControlName="admissionNumber" autocomplete="off"
          placeholder="STU-2024-0001" />
      </k-form-field>

      <k-form-field [label]="labels.classGroupId" inputId="student-class" [control]="form.controls.classGroupId"
        hint="Optional - a student can be placed later.">
        <p-select inputId="student-class" formControlName="classGroupId" [options]="classChoices()" optionLabel="label"
          optionValue="value" placeholder="Not placed yet" [showClear]="true" [filter]="true" filterBy="label" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.email" inputId="student-email" [control]="form.controls.email" hint="Optional.">
        <input pInputText id="student-email" type="email" formControlName="email" autocomplete="off" />
      </k-form-field>

      <k-form-field [label]="labels.phone" inputId="student-phone" [control]="form.controls.phone" hint="Optional.">
        <input pInputText id="student-phone" formControlName="phone" autocomplete="off" placeholder="+1 555-010-1000" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.gender" inputId="student-gender" [control]="form.controls.gender">
        <p-select inputId="student-gender" formControlName="gender" [options]="genderOptions" optionLabel="label"
          optionValue="value" />
      </k-form-field>

      <k-form-field [label]="labels.dateOfBirth" inputId="student-dob" [control]="form.controls.dateOfBirth">
        <p-datepicker inputId="student-dob" formControlName="dateOfBirth" dateFormat="dd M yy" [showIcon]="true"
          [maxDate]="today" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.admissionDate" inputId="student-admission-date"
        [control]="form.controls.admissionDate" hint="When they joined the school.">
        <p-datepicker inputId="student-admission-date" formControlName="admissionDate" dateFormat="dd M yy"
          [showIcon]="true" [maxDate]="today" />
      </k-form-field>

      <k-form-field [label]="labels.status" inputId="student-status" [control]="form.controls.status">
        <p-select inputId="student-status" formControlName="status" [options]="statusOptions" optionLabel="label"
          optionValue="value" />
      </k-form-field>
    </div>
  </form>
</k-form-dialog>
