<div class="k-student-page">
  <div class="k-student-toolbar flex flex-column sm:flex-row sm:align-items-center sm:justify-content-between gap-2">
    <div class="flex flex-column sm:flex-row sm:align-items-center gap-2">
      <p-iconfield iconPosition="left" class="k-student-search">
        <p-inputicon class="pi pi-search" />
        <input pInputText pSize="small" type="text" placeholder="Search students..." [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)" />
      </p-iconfield>

      <p-select [options]="classOptions()" [ngModel]="selectedClass()" (ngModelChange)="selectedClass.set($event)"
        optionLabel="label" optionValue="value" placeholder="All classes" size="small" [showClear]="true"
        [filter]="true" filterBy="label" styleClass="k-student-filter" />

      <p-select [options]="statusOptions" [ngModel]="selectedStatus()" (ngModelChange)="selectedStatus.set($event)"
        optionLabel="label" optionValue="value" placeholder="All statuses" size="small" [showClear]="true"
        styleClass="k-student-filter" />

      <p-button label="Clear" icon="pi pi-filter-slash" size="small" severity="secondary" [text]="true"
        [disabled]="!hasFilters()" (onClick)="clearFilters()" />
    </div>

    <p-button label="Add Student" icon="pi pi-plus" size="small" />
  </div>

  <p-dataview class="k-student-dataview" [value]="pagedStudents()" [layout]="layoutUi.layout()">
    <ng-template #empty>
      <div class="text-center text-color-secondary py-6">No students found.</div>
    </ng-template>

    <ng-template #list let-items>
      <div class="k-student-table-wrap">
        <p-table class="k-student-table" [value]="items" styleClass="p-datatable-sm">
          <ng-template pTemplate="header">
            <tr>
              <th style="width: 28%">Student</th>
              <th style="width: 16%">Admission No.</th>
              <th style="width: 14%">Class</th>
              <th style="width: 18%">Contact</th>
              <th style="width: 12%">Status</th>
              <th style="width: 12%">Actions</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-student>
            <tr>
              <td>
                <div class="flex align-items-center gap-2">
                  <p-avatar [label]="initials(student)" shape="circle" styleClass="bg-primary" />
                  <div>
                    <div class="font-medium">{{ student.firstName }} {{ student.lastName }}</div>
                    <div class="text-xs text-color-secondary">{{ student.email }}</div>
                  </div>
                </div>
              </td>
              <td>{{ student.studentDetails?.admissionNumber }}</td>
              <td>{{ student.className }}</td>
              <td>{{ student.phone }}</td>
              <td>
                <p-tag [value]="student.status" [severity]="statusSeverity(student.status)" />
              </td>
              <td>
                <div class="flex gap-1">
                  <p-button icon="pi pi-eye" [text]="true" [rounded]="true" size="small" severity="secondary"
                    pTooltip="View" />
                  <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" severity="info"
                    pTooltip="Edit" />
                  <p-button icon="pi pi-trash" [text]="true" [rounded]="true" size="small" severity="danger"
                    pTooltip="Delete" />
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </ng-template>

    <ng-template #grid let-items>
      <div class="k-student-scroll">
        <div class="grid">
          @for (student of items; track student.id) {
          <div class="col-12 sm:col-6 lg:col-4 xl:col-3">
            <app-student-card [student]="student" />
          </div>
          }
        </div>
      </div>
    </ng-template>
  </p-dataview>

  <p-paginator class="k-student-paginator" [first]="first()" [rows]="rows()" [totalRecords]="students().length"
    [rowsPerPageOptions]="rowsPerPageOptions" [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} students"
    (onPageChange)="onPageChange($event)" />
</div>
