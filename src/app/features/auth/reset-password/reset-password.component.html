<app-auth-card title="Reset your password" subtitle="Choose a new password for your account.">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="newPassword">New Password</label>
      <p-password
        id="newPassword"
        formControlName="newPassword"
        [toggleMask]="true"
        placeholder="New Password"
        class="w-full"
        inputStyleClass="w-full"
      />
      @if (submitted && form.controls.newPassword.invalid) {
        <small class="text-red-500">Password must be at least 8 characters.</small>
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="confirmPassword">Confirm Password</label>
      <p-password
        id="confirmPassword"
        formControlName="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Confirm Password"
        class="w-full"
        inputStyleClass="w-full"
      />
      @if (submitted && form.errors?.['passwordsMismatch']) {
        <small class="text-red-500">Passwords do not match.</small>
      }
    </div>

    <p-button type="submit" label="Reset Password" styleClass="w-full mt-2" />
  </form>
</app-auth-card>
