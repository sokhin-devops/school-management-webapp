<app-auth-card title="Forgot your password?" subtitle="Enter your email and we'll send you a reset link.">
  @if (!emailSent()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
      <div class="flex flex-column gap-2">
        <label for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" placeholder="you@school.com" class="w-full" />
        @if (submitted && form.controls.email.invalid) {
          <small class="text-red-500">Enter a valid email address.</small>
        }
      </div>

      <p-button type="submit" label="Send Reset Link" styleClass="w-full mt-2" [loading]="submitting()" [disabled]="submitting()" />
    </form>
  } @else {
    <div class="flex flex-column gap-3">
      <p class="mb-0">If an account exists for that email, we've sent a password reset link.</p>
      @if (devResetUrl(); as resetUrl) {
        <div class="flex flex-column gap-2 p-3 border-1 border-round surface-border">
          <small class="text-color-secondary">Dev only (no email delivery configured yet):</small>
          <a [href]="resetUrl" class="text-primary font-medium break-word">{{ resetUrl }}</a>
        </div>
      }
    </div>
  }

  <p class="text-center text-sm mt-4 mb-0">
    <a routerLink="/login" class="text-primary font-medium cursor-pointer">Back to Login</a>
  </p>
</app-auth-card>
