<k-form-dialog [visible]="visible()" (visibleChange)="visible.set($event)"
  [title]="isEdit() ? 'Edit class' : 'Add class'"
  [subtitle]="isEdit() ? 'Update this record and save.' : 'Add a class to the current academic year.'"
  [saveLabel]="isEdit() ? 'Save changes' : 'Add class'" width="40rem" (save)="onSave()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="onSave()">
    <div class="k-form-row">
      <k-form-field [label]="labels.name" inputId="class-group-name" [control]="form.controls.name">
        <input pInputText id="class-group-name" formControlName="name" autocomplete="off" placeholder="Grade 1 - A" />
      </k-form-field>

      <k-form-field [label]="labels.code" inputId="class-group-code" [control]="form.controls.code"
        hint="Optional short code, e.g. G1A.">
        <input pInputText id="class-group-code" formControlName="code" autocomplete="off" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.levelName" inputId="class-group-levelname" [control]="form.controls.levelName">
        <p-select inputId="class-group-levelname" formControlName="levelName" [options]="levelChoices()" optionLabel="label"
          optionValue="value" placeholder="Select a level" [filter]="true" filterBy="label" />
      </k-form-field>

      <k-form-field [label]="labels.programName" inputId="class-group-programname" [control]="form.controls.programName">
        <p-select inputId="class-group-programname" formControlName="programName" [options]="programChoices()" optionLabel="label"
          optionValue="value" placeholder="Select a programme" [filter]="true" filterBy="label" />
      </k-form-field>
    </div>

    <div class="k-form-row">
      <k-form-field [label]="labels.teacherName" inputId="class-group-teachername" [control]="form.controls.teacherName">
        <p-select inputId="class-group-teachername" formControlName="teacherName" [options]="teacherChoices()" optionLabel="label"
          optionValue="value" placeholder="Select a teacher" [filter]="true" filterBy="label" />
      </k-form-field>

      <k-form-field [label]="labels.capacity" inputId="class-group-capacity" [control]="form.controls.capacity"
        hint="How many students the class takes.">
        <p-inputnumber inputId="class-group-capacity" formControlName="capacity" [min]="1" [max]="200" [showButtons]="true" />
      </k-form-field>
    </div>

    <k-form-field [label]="labels.status" inputId="class-group-status" [control]="form.controls.status">
      <p-select inputId="class-group-status" formControlName="status" [options]="statusOptions" optionLabel="label"
        optionValue="value" />
    </k-form-field>
  </form>
</k-form-dialog>
