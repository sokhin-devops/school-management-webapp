<k-list-shell [loading]="programService.loading()" [error]="programService.error()"
  [hasContent]="records.total() > 0" [skeletonColumns]="[26, 14, 40, 10, 10]"
  (retry)="programService.reload()">
  <k-list-toolbar k-toolbar searchPlaceholder="Search program name or code" searchLabel="Search programs"
    [search]="records.search()" (searchChange)="records.onSearch($event)">
    <ng-container k-filters>
      <p-select styleClass="k-list-filter" [options]="statusOptions" [ngModel]="statusFilter.value()"
        (ngModelChange)="statusFilter.value.set($event); records.onFilterChange()" optionLabel="label"
        optionValue="value" placeholder="All statuses" size="small" [showClear]="true" ariaLabel="Filter by status" />

      @if (records.hasFilters()) {
        <p-button label="Clear" icon="pi pi-filter-slash" size="small" severity="secondary" [text]="true"
          (onClick)="records.clear()" />
      }
    </ng-container>

    <ng-container k-actions>
      <span class="k-list-count">{{ records.countLabel() }}</span>
      <p-button *kCan="'create'" label="Add Program" icon="pi pi-plus" size="small" (onClick)="openCreate()" />
    </ng-container>
  </k-list-toolbar>

  @if (records.page().length) {
    <div class="k-table-wrap">
      <p-table class="k-table" [value]="records.page()" [customSort]="true" [sortField]="records.sortField()"
        [sortOrder]="records.sortOrder()" (sortFunction)="records.onSort($event)" [scrollable]="true"
        scrollHeight="flex" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 26%" pSortableColumn="name">Program <p-sortIcon field="name" /></th>
            <th style="width: 14%" pSortableColumn="code">Code <p-sortIcon field="code" /></th>
            <th style="width: 40%">Description</th>
            <th style="width: 10%" pSortableColumn="status">Status <p-sortIcon field="status" /></th>
            <th style="width: 10%" class="text-right">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-program>
          <tr>
            <td class="k-cell-strong">{{ program.name }}</td>
            <td class="k-numeric">{{ program.code }}</td>
            <td [title]="program.description">{{ program.description }}</td>
            <td><k-status-tag [status]="program.status" /></td>
            <td class="text-right"><k-row-actions [label]="program.name" (view)="openView(program)" (edit)="openEdit(program)" (remove)="confirmRemove(program, program.name)" /></td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <k-empty-state icon="pi-sitemap" title="No programs found"
      [message]="records.hasFilters()
        ? 'No program matches the current search and filters.'
        : 'Programs you add will be listed here.'">
      @if (records.hasFilters()) {
        <p-button label="Clear filters" icon="pi pi-filter-slash" size="small" severity="secondary" [outlined]="true"
          (onClick)="records.clear()" />
      } @else {
        <p-button *kCan="'create'" label="Add Program" icon="pi pi-plus" size="small" (onClick)="openCreate()" />
      }
    </k-empty-state>
  }

  <p-paginator k-footer [first]="records.first()" [rows]="records.rows()" [totalRecords]="records.matching().length"
    [rowsPerPageOptions]="records.pageSizeOptions" [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    (onPageChange)="records.onPageChange($event)" />
</k-list-shell>

<app-program-form [(visible)]="formVisible" [program]="editing()"
  (saved)="onSaved($event)" />

<!-- Read-only side of a row: what the eye icon opens. -->
<k-record-drawer [(visible)]="viewVisible" [detail]="viewDetail()"
  (edit)="openEdit(viewing()!)" (remove)="confirmRemove(viewing()!, viewDetail()!.title)" />
