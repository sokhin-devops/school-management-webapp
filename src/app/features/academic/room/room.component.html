<k-list-shell [loading]="roomService.loading()" [error]="roomService.error()"
  [hasContent]="records.total() > 0" [layout]="'list'" [skeletonColumns]="[24, 12, 20, 16, 10, 8, 10]"
  (retry)="roomService.reload()">
  <k-list-toolbar k-toolbar searchPlaceholder="Search room, code or building" searchLabel="Search rooms"
    [search]="records.search()" (searchChange)="records.onSearch($event)">
    <ng-container k-filters>
      <p-select styleClass="k-list-filter" [options]="kindOptions()" [ngModel]="kindFilter.value()"
        (ngModelChange)="kindFilter.value.set($event); records.onFilterChange()" optionLabel="label"
        optionValue="value" placeholder="All types" size="small" [showClear]="true" ariaLabel="Filter by room type" />

      <p-select styleClass="k-list-filter" [options]="statusOptions" [ngModel]="statusFilter.value()"
        (ngModelChange)="statusFilter.value.set($event); records.onFilterChange()" optionLabel="label"
        optionValue="value" placeholder="All statuses" size="small" [showClear]="true" ariaLabel="Filter by status" />

      @if (records.hasFilters()) {
        <p-button label="Clear" icon="pi pi-filter-slash" size="small" severity="secondary" [text]="true"
          (onClick)="records.clear()" />
      }
    </ng-container>

    <ng-container k-actions>
      <span class="k-list-count">{{ records.countLabel() }}</span>
      <p-button *kCan="'create'" label="Add Room" icon="pi pi-plus" size="small" (onClick)="openCreate()" />
    </ng-container>
  </k-list-toolbar>

  @if (records.page().length) {
    <div class="k-table-wrap">
      <p-table class="k-table" [value]="records.page()" [customSort]="true" [sortField]="records.sortField()"
        [sortOrder]="records.sortOrder()" (sortFunction)="records.onSort($event)" [scrollable]="true"
        scrollHeight="flex" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 24%" pSortableColumn="name">Room <p-sortIcon field="name" /></th>
            <th style="width: 12%" pSortableColumn="code">Code <p-sortIcon field="code" /></th>
            <th style="width: 20%" pSortableColumn="building">Building <p-sortIcon field="building" /></th>
            <th style="width: 16%">Type</th>
            <th style="width: 10%" pSortableColumn="capacity">Capacity <p-sortIcon field="capacity" /></th>
            <th style="width: 8%">Status</th>
            <th style="width: 10%" class="text-right">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-room>
          <tr>
            <td class="k-cell-strong">{{ room.name }}</td>
            <td class="k-numeric">{{ room.code }}</td>
            <td>{{ room.building }}</td>
            <td>{{ room.kind }}</td>
            <td class="k-numeric">{{ room.capacity }}</td>
            <td><k-status-tag [status]="room.status" /></td>
            <td class="text-right"><k-row-actions [label]="room.name" (view)="openView(room)" (edit)="openEdit(room)" (remove)="confirmRemove(room, room.name)" /></td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <k-empty-state icon="pi-building" title="No rooms found"
      [message]="records.hasFilters()
        ? 'No room matches the current search and filters.'
        : 'Rooms you add will be listed here.'">
      @if (records.hasFilters()) {
        <p-button label="Clear filters" icon="pi pi-filter-slash" size="small" severity="secondary" [outlined]="true"
          (onClick)="records.clear()" />
      } @else {
        <p-button *kCan="'create'" label="Add Room" icon="pi pi-plus" size="small" (onClick)="openCreate()" />
      }
    </k-empty-state>
  }

  <p-paginator k-footer [first]="records.first()" [rows]="records.rows()" [totalRecords]="records.matching().length"
    [rowsPerPageOptions]="records.pageSizeOptions" [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    (onPageChange)="records.onPageChange($event)" />
</k-list-shell>

<app-room-form [(visible)]="formVisible" [room]="editing()" [kindOptions]="kindOptions()"
  (saved)="onSaved($event)" />

<!-- Read-only side of a row: what the eye icon opens. -->
<k-record-drawer [(visible)]="viewVisible" [detail]="viewDetail()"
  (edit)="openEdit(viewing()!)" (remove)="confirmRemove(viewing()!, viewDetail()!.title)" />
