<k-list-shell>
  <k-list-toolbar k-toolbar searchPlaceholder="Search level or program" searchLabel="Search levels"
    [search]="records.search()" (searchChange)="records.onSearch($event)">
    <ng-container k-filters>
      <p-select styleClass="k-list-filter" [options]="programOptions()" [ngModel]="programFilter.value()"
        (ngModelChange)="programFilter.value.set($event); records.onFilterChange()" optionLabel="label"
        optionValue="value" placeholder="All programs" size="small" [showClear]="true" [filter]="true"
        filterBy="label" ariaLabel="Filter by program" />

      <p-select styleClass="k-list-filter" [options]="statusOptions" [ngModel]="statusFilter.value()"
        (ngModelChange)="statusFilter.value.set($event); records.onFilterChange()" optionLabel="label"
        optionValue="value" placeholder="All statuses" size="small" [showClear]="true" ariaLabel="Filter by status" />

      @if (records.hasFilters()) {
        <p-button label="Clear" icon="pi pi-filter-slash" size="small" severity="secondary" [text]="true"
          (onClick)="records.clear()" />
      }
    </ng-container>

    <ng-container k-actions>
      <span class="k-list-count">{{ records.countLabel() }}</span>
      <p-button label="Add Level" icon="pi pi-plus" size="small" />
    </ng-container>
  </k-list-toolbar>

  @if (records.page().length) {
    <div class="k-table-wrap">
      <p-table class="k-table" [value]="records.page()" [customSort]="true" [sortField]="records.sortField()"
        [sortOrder]="records.sortOrder()" (sortFunction)="records.onSort($event)" [scrollable]="true"
        scrollHeight="flex" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 8%" pSortableColumn="order">Order <p-sortIcon field="order" /></th>
            <th style="width: 26%" pSortableColumn="name">Level <p-sortIcon field="name" /></th>
            <th style="width: 16%">Shown as</th>
            <th style="width: 28%" pSortableColumn="programName">Program <p-sortIcon field="programName" /></th>
            <th style="width: 10%" pSortableColumn="status">Status <p-sortIcon field="status" /></th>
            <th style="width: 12%" class="text-right">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-level>
          <tr>
            <td class="k-numeric">{{ level.order }}</td>
            <td class="k-cell-strong">{{ level.name }}</td>
            <td><p-tag [value]="level.displayLabel" severity="secondary" [rounded]="true" /></td>
            <td>{{ level.programName }}</td>
            <td><k-status-tag [status]="level.status" /></td>
            <td class="text-right"><k-row-actions [label]="level.name" /></td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <k-empty-state icon="pi-list" title="No levels found"
      [message]="records.hasFilters()
        ? 'No level matches the current search and filters.'
        : 'Levels you add will be listed here.'">
      @if (records.hasFilters()) {
        <p-button label="Clear filters" icon="pi pi-filter-slash" size="small" severity="secondary" [outlined]="true"
          (onClick)="records.clear()" />
      } @else {
        <p-button label="Add Level" icon="pi pi-plus" size="small" />
      }
    </k-empty-state>
  }

  <p-paginator k-footer [first]="records.first()" [rows]="records.rows()" [totalRecords]="records.matching().length"
    [rowsPerPageOptions]="records.pageSizeOptions" [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    (onPageChange)="records.onPageChange($event)" />
</k-list-shell>
