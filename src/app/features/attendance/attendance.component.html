<k-list-shell>
  <div k-toolbar class="k-report-toolbar">
    <p-datepicker [(ngModel)]="date" [showIcon]="true" size="small" dateFormat="d M yy" inputId="attendance-date"
      ariaLabel="Attendance date" styleClass="k-attendance-date" />

    <p-select styleClass="k-list-filter" [options]="classOptions()" [ngModel]="className()"
      (ngModelChange)="className.set($event)" optionLabel="label" optionValue="value" placeholder="Select class"
      size="small" [filter]="true" filterBy="label" ariaLabel="Class" />

    <p-selectbutton [options]="sessionOptions" [ngModel]="session()" (ngModelChange)="session.set($event)"
      optionLabel="label" optionValue="value" [allowEmpty]="false" size="small" ariaLabel="Session" />

    <div class="k-attendance-summary">
      <span class="k-tally is-present">{{ summary().present }} present</span>
      <span class="k-tally is-absent">{{ summary().absent }} absent</span>
      <span class="k-tally is-late">{{ summary().late }} late</span>
      <span class="k-tally is-excused">{{ summary().excused }} excused</span>
    </div>

    <p-button label="Reset" icon="pi pi-replay" size="small" severity="secondary" [text]="true"
      (onClick)="markAllPresent()" />
    <p-button label="Save attendance" icon="pi pi-check" size="small" />
  </div>

  @if (roster().length) {
    <div class="k-table-wrap">
      <p-table class="k-table" [value]="roster()" [scrollable]="true" scrollHeight="flex" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 34%">Student</th>
            <th style="width: 16%">Admission no.</th>
            <th style="width: 26%">Attendance</th>
            <th style="width: 24%">Note</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr>
            <td>
              <div class="k-person-cell">
                <p-avatar [label]="initials(row.student)" shape="circle" styleClass="k-person-cell-avatar" />
                <div class="k-person-cell-identity">
                  <span class="k-person-cell-name">{{ fullName(row.student) }}</span>
                  <span class="k-person-cell-sub">{{ row.student.className }}</span>
                </div>
              </div>
            </td>
            <td class="k-numeric">{{ row.student.studentDetails?.admissionNumber }}</td>
            <td>
              <p-selectbutton [options]="markOptions" [ngModel]="row.mark"
                (ngModelChange)="setMark(row.student.id, $event)" optionLabel="label" optionValue="value"
                [allowEmpty]="false" size="small" styleClass="k-mark-picker"
                [ariaLabel]="'Attendance for ' + fullName(row.student)" />
            </td>
            <td>
              <input pInputText pSize="small" class="k-note-input" [ngModel]="row.note"
                (ngModelChange)="setNote(row.student.id, $event)" placeholder="Add a note"
                [attr.aria-label]="'Note for ' + fullName(row.student)" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <k-empty-state icon="pi-calendar-clock" title="No students in this class"
      message="Pick another class, or add students to this one first." />
  }
</k-list-shell>
