<p-dialog [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true" [draggable]="false"
  [resizable]="false" [closeOnEscape]="true" [dismissableMask]="false" [style]="{ width: width() }"
  [breakpoints]="{ '640px': '95vw' }" styleClass="k-form-dialog" (onHide)="cancel.emit()">
  <ng-template #header>
    <div class="k-form-dialog-head">
      <h2 class="k-form-dialog-title">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="k-form-dialog-sub">{{ subtitle() }}</p>
      }
    </div>
  </ng-template>

  <div class="k-form-dialog-body">
    <ng-content />
  </div>

  <ng-template #footer>
    <p-button label="Cancel" size="small" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button [label]="saveLabel()" icon="pi pi-check" size="small" (onClick)="save.emit()" />
  </ng-template>
</p-dialog>
