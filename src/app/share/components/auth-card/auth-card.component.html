<div class="flex align-items-center justify-content-center min-h-screen surface-ground p-3">
  <div class="w-full" [style.max-width]="maxWidth">
    <div class="text-center mb-4">
      <span class="text-2xl font-bold text-primary">SchoolSuite</span>
    </div>

    <p-card>
      @if (title) {
        <h1 class="text-2xl font-semibold mt-0 mb-2">{{ title }}</h1>
      }
      @if (subtitle) {
        <p class="text-color-secondary mt-0 mb-4">{{ subtitle }}</p>
      }
      <ng-content></ng-content>
    </p-card>
  </div>
</div>
