<div class="k-shell" kFloatingScroll=".p-datatable-table-container, .k-grid-scroll, .k-page-scroll">
  <div class="k-shell-toolbar"><ng-content select="[k-toolbar]" /></div>

  <div class="k-shell-body">
    @if (showSkeleton()) {
      <k-list-skeleton [layout]="layout()" [columns]="skeletonColumns()" />
    } @else if (showError()) {
      <k-empty-state icon="pi-exclamation-triangle" title="This list could not be loaded" [message]="error() ?? ''">
        <p-button label="Try again" icon="pi pi-refresh" size="small" severity="secondary" [outlined]="true"
          (onClick)="retry.emit()" />
      </k-empty-state>
    }

    <!-- Projected once and hidden rather than wrapped in the @else above.
         Conditional <ng-content> wedged the whole page when a shell was inside a
         lazily-rendered tab panel: the content is created by the parent either
         way, and taking it in and out of the DOM from here re-entered. -->
    <div class="k-shell-content" [class.k-shell-content-away]="showSkeleton() || showError()">
      <ng-content />
    </div>
  </div>

  <div class="k-shell-footer"><ng-content select="[k-footer]" /></div>
</div>
